[package]
name = "podcastic"
version = "2.0.0"
edition = "2021"
description = "Podcastic - Multi-user podcast streaming application backend"
license = "MIT"

[dependencies]
anyhow = "1.0.86"
axum = "0.7.5"
bcrypt = "0.15.1"
bson = { version = "2.11.0", features = ["chrono-0_4"] }
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3.30"
jsonwebtoken = "9.3.0"
mongodb = "2.8.2"
rand = "0.8"
redis = { version = "0.25.4", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }
rss = "2.0.8"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.38.0", features = ["full"] }
tower-http = { version = "0.5.2", features = ["fs", "cors", "set-header", "trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
url = "2.5.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
